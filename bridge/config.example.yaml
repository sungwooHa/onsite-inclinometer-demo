# 브리지 설정 예시 — 복사해서 config.yaml 로 저장 후 값만 채우세요.
#   cp config.example.yaml config.yaml
# config.yaml 은 .gitignore 처리됨(토큰 노출 방지).

serial:
  # ESP32를 블루투스로 페어링하면 컴퓨터엔 "시리얼 포트"로 잡힌다(pyserial이 USB처럼 연다).
  # macOS:   ls /dev/cu.*   블루투스 예) /dev/cu.MIDAS_ONSITE_SENSOR  / USB 직결 예) /dev/cu.usbserial-0001
  # Windows: 장치관리자 COM 포트.  블루투스는 반드시 "나가는(outgoing)" COM 을 써야 함(예: COM5).
  #          페어링만 하고 outgoing COM 을 안 열면 ESP32 연결로 인식 못 해 LED 가 계속 깜빡인다.
  port: "/dev/cu.MIDAS_ONSITE_SENSOR"
  baudrate: 115200

api:
  # 온사이트 계측 API (docs/api-contract.md). URL 끝 숫자(2100)가 센서ID.
  url: "https://api.onsite.kr-qa-midasit.com/inclinometer/sensor/2100"
  method: "POST"
  headers:
    Authorization: "Bearer <YOUR_TOKEN>"
    Content-Type: "application/json"

# DANGER 시: 대상 센서의 최신 프로파일을 GET해 심도 그리드/모양을 자동으로 맞추고,
# 피크 변위만 랜덤 스케일해서 POST한다(센서에 데이터가 없거나 GET 실패 시 bridge/payload.json 사용).
# 랜덤 피크 범위(항상 3차=3mm 초과)는 bridge/bridge.py 상단 PEAK_DISPLACEMENT_MIN/MAX_MM 상수로 조정.
